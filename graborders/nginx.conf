server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # React SPA – all unmatched paths serve index.html
    # ----------------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # ----------------------------------------------------------------
    # TradingView Screener REST API proxy
    # The frontend calls /api/tv/... and Nginx rewrites + forwards.
    # ----------------------------------------------------------------
    location /api/tv/ {
        proxy_pass https://screener-facade.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host              screener-facade.tradingview.com;
        proxy_set_header Origin            "https://www.tradingview.com";
        proxy_set_header Referer           "https://www.tradingview.com/";
        proxy_set_header User-Agent        "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_set_header Accept            "application/json, text/plain, */*";
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ----------------------------------------------------------------
    # TradingView WebSocket proxy
    #
    # Browser connects to:  ws://VPS_IP:PORT/ws/socket.io/websocket
    # Nginx proxies to:      wss://widgetdata.tradingview.com/socket.io/websocket
    #
    # The trailing slash in proxy_pass strips the /ws prefix so the
    # path forwarded to TV is /socket.io/websocket (no /ws/).
    # ----------------------------------------------------------------
    location /ws/ {
        proxy_pass              https://widgetdata.tradingview.com/;
        proxy_http_version      1.1;

        # WebSocket upgrade handshake
        proxy_set_header        Upgrade    $http_upgrade;
        proxy_set_header        Connection "upgrade";

        # Spoof headers so TradingView accepts the connection
        proxy_set_header        Host       widgetdata.tradingview.com;
        proxy_set_header        Origin     "https://www.tradingview.com";
        proxy_set_header        Referer    "https://www.tradingview.com/";
        proxy_set_header        User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

        # SSL to backend
        proxy_ssl_server_name   on;

        # Keep long-lived WebSocket connections alive (24 h)
        proxy_read_timeout      86400s;
        proxy_send_timeout      86400s;

        # Never buffer WebSocket frames — deliver them immediately
        proxy_buffering         off;
        proxy_cache             off;
    }

    # ----------------------------------------------------------------
    # TradingView chart static assets (SVG logos, etc.)
    # ----------------------------------------------------------------
    location /tv-static/ {
        proxy_pass          https://s3.tradingview.com/;
        proxy_ssl_server_name on;
        proxy_set_header    Host s3.tradingview.com;
    }
}
