<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Device redirect: runs BEFORE the app bundle so big screens go to the PC site.
       Only active on the production domain (local dev is untouched). -->
  <script>
    (function () {
      try {
        var host = location.hostname;
        var onMobileDomain = host === 'papperstoneaus.com' || host === 'www.papperstoneaus.com';
        if (!onMobileDomain) return;

        var ua = navigator.userAgent || '';
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
        var w = window.innerWidth || document.documentElement.clientWidth || screen.width || 0;

        // Big screen + not a mobile device → send to the PC site
        if (!isMobileUA && w >= 1024) {
          location.replace('https://pc.papperstoneaus.com' + location.pathname + location.search + location.hash);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
