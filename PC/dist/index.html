<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <!-- Device redirect: runs BEFORE the app bundle so small screens / phones go
       to the mobile site. Only active on the production domain (dev untouched). -->
  <script>
    (function () {
      try {
        if (location.hostname !== 'pc.papperstoneaus.com') return;

        var ua = navigator.userAgent || '';
        var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
        var w = window.innerWidth || document.documentElement.clientWidth || screen.width || 0;

        // Mobile device OR small screen → send to the phone site
        if (isMobileUA || w < 1024) {
          location.replace('https://papperstoneaus.com' + location.pathname + location.search + location.hash);
        }
      } catch (e) {}
    })();
  </script>
